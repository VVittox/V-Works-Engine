[project]
name = "v-works-engine"
version = "0.8.0"
description = "V Works Engine: a 2D and 3D Python game engine and editor with scene, runtime and Windows export tooling"
requires-python = ">=3.10"
dependencies = [
  "pygame>=2.5.2,<3",
]

[project.optional-dependencies]
editor = ["PySide6>=6.7,<7", "PyInstaller>=6.6,<7"]

[tool.setuptools.packages.find]
include = ["engine*"]
